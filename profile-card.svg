<svg width="1222" height="580" viewBox="0 0 1222 580" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="avatarClip">
      <rect x="40" y="40" width="300" height="440" rx="18"/>
    </clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .label { fill: #e08a6b; font-weight: 600; }
      .value { fill: #e6e6f0; }
      .dim { fill: #9aa2b1; }
      .title { fill: #e6e6f0; font-weight: 700; }
    </style>
  </defs>

  <!-- page background (transparent-friendly, matches card bg) -->
  <rect x="0" y="0" width="1222" height="580" fill="#242a38"/>

  <!-- ===== Avatar card ===== -->
  <rect x="16" y="16" width="348" height="488" rx="22" fill="#2b3244" stroke="#3d4459" stroke-width="1.5"/>
  <!-- Replace the xlink:href below with your own photo URL -->
  <image x="40" y="40" width="300" height="440" href="YOUR_IMAGE_URL_HERE" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="40" y="40" width="300" height="440" rx="18" fill="none" stroke="#3d4459" stroke-width="1"/>
  <text x="190" y="450" text-anchor="middle" class="mono dim" font-size="15" letter-spacing="2">— AlaaKaabachi —</text>

  <!-- ===== Info card ===== -->
  <rect x="380" y="16" width="826" height="488" rx="22" fill="#2b3244" stroke="#3d4459" stroke-width="1.5"/>

  <!-- header -->
  <text x="793" y="60" text-anchor="middle" class="mono title" font-size="20">&lt; AlaaKaabachi &gt;</text>
  <line x1="600" y1="78" x2="986" y2="78" stroke="#4a536b" stroke-width="1.5" stroke-dasharray="3,4"/>

  <!-- fields -->
  <g class="mono" font-size="17">
    <text x="410" y="115"><tspan class="label">Role:</tspan> <tspan class="value">Data Science Student</tspan></text>
    <text x="410" y="145"><tspan class="label">Origin:</tspan> <tspan class="value">Tunisia</tspan></text>
    <text x="410" y="175"><tspan class="label">Status:</tspan> <tspan class="value">Learning, Building, Shipping</tspan></text>
    <text x="410" y="205"><tspan class="label">Language:</tspan> <tspan class="value">Python, JavaScript, C++</tspan></text>
    <text x="410" y="235"><tspan class="label">Frontend:</tspan> <tspan class="value">Next.js, React</tspan></text>
    <text x="410" y="265"><tspan class="label">Backend:</tspan> <tspan class="value">FastAPI, Express</tspan></text>
    <text x="410" y="295"><tspan class="label">Database:</tspan> <tspan class="value">PostgreSQL, MongoDB, MySQL, Firebase, Supabase</tspan></text>
    <text x="410" y="325"><tspan class="label">Infrastructure:</tspan> <tspan class="value">Azure, Docker</tspan></text>
    <text x="410" y="355"><tspan class="label">Mail:</tspan> <tspan class="value">alaakaabachi100@gmail.com</tspan></text>
    <text x="410" y="385"><tspan class="label">Portfolio:</tspan> <tspan class="value">kaabachialaa.github.io/AlaaKaabachiProjectWebsite</tspan></text>
    <text x="410" y="415"><tspan class="label">LinkedIn:</tspan> <tspan class="value">linkedin.com/in/kaabach-alaa</tspan></text>
  </g>

  <line x1="410" y1="440" x2="1176" y2="440" stroke="#4a536b" stroke-width="1.5" stroke-dasharray="3,4"/>

  <!-- color palette dots -->
  <g>
    <circle cx="425" cy="470" r="13" fill="#e0645f"/>
    <circle cx="463" cy="470" r="13" fill="#e08a4f"/>
    <circle cx="501" cy="470" r="13" fill="#e5c07b"/>
    <circle cx="539" cy="470" r="13" fill="#8fbf7f"/>
    <circle cx="577" cy="470" r="13" fill="#56b6c2"/>
    <circle cx="615" cy="470" r="13" fill="#61afef"/>
    <circle cx="653" cy="470" r="13" fill="#c48fd9"/>
    <circle cx="691" cy="470" r="13" fill="#f0f0f5"/>
  </g>

  <!-- ===== terminal breadcrumb (bottom left) ===== -->
  <g transform="translate(16, 522)">
    <rect x="0" y="0" width="330" height="42" rx="8" fill="#2b3244"/>
    <rect x="0" y="0" width="70" height="42" rx="8" fill="#4a5578"/>
    <rect x="55" y="0" width="90" height="42" fill="#4a5578"/>
    <text x="35" y="27" text-anchor="middle" class="mono value" font-size="15">gh</text>
    <path d="M145 0 L165 0 L145 42 L125 42 Z" fill="#4a5578"/>
    <rect x="145" y="0" width="110" height="42" fill="#6b7aa8"/>
    <text x="130" y="27" class="mono value" font-size="15">~/</text>
    <path d="M255 0 L275 0 L255 42 L235 42 Z" fill="#6b7aa8"/>
    <rect x="255" y="0" width="150" height="42" rx="8" fill="#d98a5f"/>
    <path d="M255 0 L275 0 L255 42 L235 42 Z" fill="#d98a5f"/>
    <text x="270" y="27" class="mono title" font-size="15" fill="#2b2320">AlaaKaabachi</text>
  </g>

  <!-- ===== date badge (bottom right) ===== -->
  <g transform="translate(1016, 522)">
    <rect x="0" y="0" width="190" height="42" rx="21" fill="#e6e6f0"/>
    <text x="95" y="27" text-anchor="middle" class="mono" font-size="15" fill="#242a38">2026-08-25</text>
  </g>
</svg>
